name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU torch first: hosted runners have no GPU and the CUDA wheels
      # waste several minutes of download.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests (no torch model needed - ultralytics is imported lazily)
        run: pytest -v

      # The app module must import cleanly with NO secrets present: CI proves
      # a fresh checkout is not broken before anyone adds credentials.
      - name: Import check (no secrets required)
        run: python -c "import app; print('app module imports cleanly without secrets')"
